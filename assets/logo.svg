<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CFF" />
      <stop offset="50%" stop-color="#4A3AFF" />
      <stop offset="100%" stop-color="#2A1B9A" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="open-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#F0F0F5" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg-gradient)" />

  <!-- The Johari Window Framework (4 Quadrants) -->
  <g transform="translate(256, 256)">
    <!-- Top Left: Open Area (Maximum Clarity) -->
    <rect x="0" y="0" width="224" height="224" rx="64" fill="url(#open-gradient)" filter="url(#glow)" />
    
    <!-- Top Right: Blind Spot (High Visibility to others, but slightly veiled) -->
    <rect x="288" y="0" width="224" height="224" rx="64" fill="#FFFFFF" fill-opacity="0.65" />
    
    <!-- Bottom Left: Hidden Area (Known to self, hidden from others) -->
    <rect x="0" y="288" width="224" height="224" rx="64" fill="#FFFFFF" fill-opacity="0.35" />
    
    <!-- Bottom Right: Unknown Area (Maximum Mystery) -->
    <rect x="288" y="288" width="224" height="224" rx="64" fill="#FFFFFF" fill-opacity="0.10" />
  </g>
</svg>
